services:
  # Приложение Книжный магазин
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookstore_api
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///flask_auth.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - HOST=0.0.0.0
      - PORT=5001
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
    networks:
      - bookstore_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/books"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookstore_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://app:5001
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore_network

  # PostgreSQL (опционально, для продакшена)
  # Раскомментируйте для использования PostgreSQL вместо SQLite
  # db:
  #   image: postgres:15-alpine
  #   container_name: bookstore_db
  #   environment:
  #     POSTGRES_DB: bookstore
  #     POSTGRES_USER: ${DB_USER:-bookstore_user}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-bookstore_password}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   networks:
  #     - bookstore_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookstore_user}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  bookstore_network:
    driver: bridge

